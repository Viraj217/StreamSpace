name: streamspace
description: A local-first, cross-device personal resource space.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  receive_sharing_intent: 1.8.1
  hive_flutter: ^1.1.0
  web_socket_channel: ^2.4.5
  path_provider: ^2.1.3
  url_launcher: ^6.3.1
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
